name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Run tests
        run: uv run --locked python -m unittest discover -s tests
      # The root run never resolves plugins/herdboard/uv.lock. Check that its
      # lock file matches its manifest and that its own packages import.
      - name: Check the herdboard lock file
        run: uv lock --check --project plugins/herdboard
      - name: Import herdboard from its own lock file
        run: uv run --locked --project plugins/herdboard python -c "import textual, yaml, tomlkit, herdboard.board, herdboard.cli"
