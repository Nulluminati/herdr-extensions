name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check the format
        run: uv run --locked ruff format --check .
      - name: Run tests
        run: uv run --locked pytest -n auto --cov=plugins --cov-report=term-missing
      # The root run never resolves plugins/herdboard/uv.lock. Check that its
      # lock file matches its manifest and that its own packages import.
      - name: Check the herdboard lock file
        run: uv lock --check --project plugins/herdboard
      - name: Import herdboard from its own lock file
        run: uv run --locked --project plugins/herdboard python -c "import textual, yaml, tomlkit, herdboard.board, herdboard.cli"
