id = "nulluminati.default-layout"
name = "Default Layout"
version = "0.1.0"
# Needs the layout.apply and tab.move socket methods.
min_herdr_version = "0.9.0"
description = "Open the projects, tabs and panes listed in layout.toml when the Herdr server starts."
platforms = ["linux", "macos"]

# Herdr runs these from the plugin root. A fresh session gets every missing
# project; a restored session gets its programs relaunched and no new workspace.
[[startup]]
command = ["python3", "bin/default_layout.py", "startup"]

[[actions]]
id = "apply"
title = "Default layout: apply to this workspace"
contexts = ["workspace"]
command = ["python3", "bin/default_layout.py", "apply"]
