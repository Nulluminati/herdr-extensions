# Default Layout: the projects that Herdr opens when its server starts.
#
# Copy this file to the plugin's config directory as layout.toml:
#   cp examples/layout.toml "$(herdr plugin config-dir nulluminati.default-layout)/layout.toml"
#
# [[projects]]          One workspace.
#   label               The workspace name. Unique in the file. A workspace with
#                       this label, or with a pane in `path`, counts as the open
#                       project.
#   path                The project directory. `~` is expanded. A project whose
#                       directory does not exist is skipped.
#
# [[projects.tabs]]     One tab, in the order given. The first tab is active.
#   name                The tab label. Required. Two tabs may share a name; the
#                       plugin matches tabs by name in file order. Do not use a
#                       bare number, which Herdr gives to an unnamed tab.
#   command             A program for a one-pane tab, such as "nvim".
#   agent               An agent for a one-pane tab, such as "claude" or "pi".
#   working_dir         A directory for a one-pane tab. A relative path is
#                       relative to the project `path`.
#   A tab with none of these is one shell in the project directory.
#
# [[projects.tabs.panes]]  Up to 4 panes, instead of the keys above.
#   label               The pane name.
#   command, agent, working_dir
#                       The same as for a one-pane tab. Set `command` or
#                       `agent`, not both. No program gives a shell.
#   split               "down" (the default) or "right". Each pane after the
#                       first splits everything above it in this direction.
#   ratio               The share of the space the earlier panes keep, between
#                       0 and 1. The default is 0.5.
#
# A program runs as `sh -c '<program>; exec $SHELL'`, so quitting it leaves
# your shell in the pane.

[[projects]]
label = "herdr-extensions"
path = "~/Projects/herdr-extensions"

[[projects.tabs]]
name = "agents"

[[projects.tabs.panes]]
label = "pi"
agent = "pi"
# agent = "claude"

[[projects.tabs.panes]]
label = "shell"
split = "right"
# ratio = 0.6

[[projects.tabs]]
name = "editor"
command = "nvim"

[[projects.tabs]]
name = "git"
working_dir = "plugins"
# working_dir = "~/Projects/herdr-extensions/plugins"

[[projects.tabs]]
name = "shell"
