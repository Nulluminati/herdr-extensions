[project]
name = "herdboard"
version = "0.1.0"
description = "Kanban board for Obsidian Markdown todos and Linear issues, inside Herdr"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
herdboard = "herdboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herdboard"]
