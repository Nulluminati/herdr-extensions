[project]
name = "herdboard"
version = "0.1.0"
description = "Kanban board for local todos and Linear issues, inside Herdr"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "textual>=8.2.8",
    "tomlkit>=0.15.1",
]

[project.scripts]
herdboard = "herdboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herdboard"]
