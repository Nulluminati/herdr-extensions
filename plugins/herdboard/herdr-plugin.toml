id = "nulluminati.herdboard"
name = "herdboard"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Kanban board for Obsidian Markdown todos and Linear issues."
platforms = ["linux", "macos"]

# The action opens the board pane in the focused pane's directory, so the
# board shows that repository. The pane runs the CLI through uv, which
# provides Textual from this plugin's pyproject.toml.
[[actions]]
id = "board"
title = "herdboard: open the board"
contexts = ["pane", "workspace"]
command = ["python3", "bin/open_board.py"]

[[panes]]
id = "board"
title = "herdboard"
placement = "tab"
command = ["sh", "-c", "exec uv run --quiet --project \"$HERDR_PLUGIN_ROOT\" herdboard board"]

# The same board, opened on the open GitHub pull requests of the repository.
[[actions]]
id = "prs"
title = "herdboard: review pull requests"
contexts = ["pane", "workspace"]
command = ["python3", "bin/open_board.py", "prs"]

[[panes]]
id = "prs"
title = "herdboard PRs"
placement = "tab"
command = ["sh", "-c", "exec uv run --quiet --project \"$HERDR_PLUGIN_ROOT\" herdboard board --prs"]

# Herdr keeps sidebar tokens in memory only. After a restart, report the
# started cards' tokens again. An agent can come back after startup, so the
# refresh also runs when Herdr finds an agent. The script returns at once.
[[startup]]
command = ["python3", "bin/sidebar_refresh.py"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "bin/sidebar_refresh.py"]
