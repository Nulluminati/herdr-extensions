id = "nulluminati.peer-review"
name = "Peer Review"
version = "0.1.0"
# Needs agent start and agent prompt --wait.
min_herdr_version = "0.9.0"
description = "Review uncommitted changes, else branch commits since the upstream. Pairings: Claude to pi, pi to Codex, Codex to Claude."
platforms = ["linux", "macos"]

# Herdr runs actions from the plugin root. The script returns at once and a
# background worker prompts the requesting agent when the findings are ready.
[[actions]]
id = "request"
title = "Peer review: changes of the focused agent"
contexts = ["pane", "workspace"]
command = ["python3", "bin/peer_review.py", "request"]
