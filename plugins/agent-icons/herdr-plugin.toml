id = "nulluminati.agent-icons"
name = "Agent Icons"
version = "0.1.0"
# Needs pane tokens in sidebar rows.
min_herdr_version = "0.9.0"
description = "Put each agent's vendor logo in the $agent_icon token, so the sidebar Agents list can show it."
platforms = ["linux", "macos"]

# Herdr runs these from the plugin root. With no event the script covers every
# agent pane; with pane.agent_detected it covers the one pane in the event.
[[startup]]
command = ["python3", "bin/agent_icons.py"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "bin/agent_icons.py"]

[[actions]]
id = "refresh"
title = "Agent icons: refresh"
command = ["python3", "bin/agent_icons.py"]
