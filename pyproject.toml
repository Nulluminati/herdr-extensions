[project]
name = "herdr-extensions"
version = "0.1.0"
description = "Herdr plugins for Claude Code, pi and Codex"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "graphql-core>=3.3.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.3",
    "textual>=8.2.8",
    "tomlkit>=0.15.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugins/herdboard/src", "tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error"]
xfail_strict = true
