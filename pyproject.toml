[project]
name = "herdr-extensions"
version = "0.1.0"
description = "Herdr plugins for Claude Code, pi and Codex"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error"]
xfail_strict = true

[tool.ruff]
line-length = 120
src = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF100"]
